<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catur Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl bg-slate-900/80 backdrop-blur-md border border-slate-700/50 rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col items-center">
        
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500 mb-6 text-center">
            ♟️ Peer Chess Arena
        </h1>

        <div id="connection-panel" class="w-full flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700 mb-6">
            <div class="flex flex-col items-center md:items-start">
                <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">ID Anda</span>
                <div class="flex items-center gap-2 mt-1">
                    <span id="my-id" class="font-mono text-cyan-300 bg-slate-900 px-3 py-1 rounded border border-slate-700 select-all">Menghubungkan...</span>
                    <button onclick="navigator.clipboard.writeText(document.getElementById('my-id').innerText); alert('ID disalin!');" class="bg-cyan-600 hover:bg-cyan-500 text-xs px-2.5 py-1.5 rounded text-white transition">Salin</button>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full md:w-auto">
                <input type="text" id="peer-id-input" placeholder="Masukkan ID Lawan..." class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 w-full md:w-64">
                <button id="connect-btn" class="bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold px-4 py-2 rounded text-white transition whitespace-nowrap shadow-lg shadow-indigo-600/30">Tantang</button>
            </div>
        </div>

        <div id="status-bar" class="w-full text-center mb-4 text-sm font-medium text-amber-400">
            Status: Menunggu koneksi atau buat tantangan baru...
        </div>

        <div class="flex flex-col md:flex-row gap-6 items-center justify-center w-full">
            <div id="board" class="w-full max-w-[360px] md:max-w-[420px] aspect-square shadow-2xl rounded-lg overflow-hidden border-4 border-slate-700"></div>
            
            <div class="flex flex-col justify-between h-full bg-slate-800/40 border border-slate-700/50 p-4 rounded-xl w-full md:w-64">
                <div>
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-2">Riwayat Langkah</h3>
                    <div id="move-history" class="h-48 overflow-y-auto bg-slate-900/60 p-2 rounded border border-slate-700/50 font-mono text-xs text-slate-300 flex flex-col gap-1">
                        <span class="text-slate-500 italic">Belum ada langkah...</span>
                    </div>
                </div>
                <button onclick="location.reload()" class="mt-4 bg-rose-600/80 hover:bg-rose-600 text-xs font-semibold py-2 rounded text-white transition">Reset / Keluar</button>
            </div>
        </div>

    </div>

    <script>
        let board = null;
        let game = new Chess();
        let peer = null;
        let conn = null;
        let myRole = null; // 'white' atau 'black'
        let peerId = null;

        // Inisialisasi PeerJS
        function initPeer() {
            // Menggunakan public PeerJS server
            peer = new Peer();

            peer.on('open', (id) => {
                peerId = id;
                document.getElementById('my-id').innerText = id;
                document.getElementById('status-bar').innerText = 'Siap! Bagikan ID Anda atau masukkan ID lawan untuk mulai.';
            });

            // Menerima panggilan masuk (Koneksi dari pemain lain)
            peer.on('connection', (connection) => {
                if (conn) {
                    connection.close();
                    return;
                }
                conn = connection;
                myRole = 'white'; // Pemilik link/penerima koneksi jadi Putih
                setupConnection();
                document.getElementById('status-bar').innerText = 'Lawan terhubung! Anda bermain sebagai PUTIH.';
                alert('Lawan berhasil terhubung! Anda memegang buah Putih.');
            });

            peer.on('error', (err) => {
                console.error(err);
                alert('Terjadi kesalahan pada koneksi PeerJS: ' + err.type);
            });
        }

        // Tombol Tantang / Connect ke Lawan
        document.getElementById('connect-btn').addEventListener('click', () => {
            const targetId = document.getElementById('peer-id-input').value.trim();
            if (!targetId) {
                alert('Masukkan ID lawan terlebih dahulu!');
                return;
            }
            if (targetId === peerId) {
                alert('Anda tidak bisa menantang diri sendiri!');
                return;
            }

            document.getElementById('status-bar').innerText = 'Menghubungkan ke lawan...';
            conn = peer.connect(targetId);
            myRole = 'black'; // Yang inisiasi koneksi jadi Hitam
            setupConnection();
        });

        // Mengatur event handler untuk koneksi data PeerJS
        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('connection-panel').classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('status-bar').innerText = `Terhubung! Anda bermain sebagai ${myRole === 'white' ? 'PUTIH' : 'HITAM'}.`;
                
                // Balikkan papan jika pemain adalah Hitam
                if (myRole === 'black') {
                    board.orientation('black');
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    // Terima langkah dari lawan
                    const move = game.move(data.move);
                    if (move) {
                        board.position(game.fen());
                        updateMoveHistory(move);
                        checkGameStatus();
                    }
                }
            });

            conn.on('close', () => {
                alert('Lawan telah memutuskan koneksi.');
                location.reload();
            });
        }

        // Callback saat pemain menggeser buah catur di UI
        function onDragStart (source, piece, position, orientation) {
            // Cek apakah game sudah selesai
            if (game.game_over()) return false;

            // Cek giliran warna buah
            if ((myRole === 'white' && piece.search(/^b/) !== -1) ||
                (myRole === 'black' && piece.search(/^w/) !== -1)) {
                return false;
            }

            // Cek apakah giliran jalan sesuai dengan warna pemain
            if ((game.turn() === 'w' && myRole !== 'white') ||
                (game.turn() === 'b' && myRole !== 'black')) {
                return false;
            }
        }

        function onDrop (source, target) {
            // Coba langkah secara lokal
            let moveObj = {
                from: source,
                to: target,
                promotion: 'q' // Otomatis promosi ke ratu demi kemudahan
            };

            const move = game.move(moveObj);

            // Jika langkah tidak sah, kembalikan posisi
            if (move === null) return 'snapback';

            // Kirim langkah ke lawan via PeerJS
            if (conn && conn.open) {
                conn.send({ type: 'move', move: moveObj });
            }

            updateMoveHistory(move);
            checkGameStatus();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateMoveHistory(move) {
            const historyEl = document.getElementById('move-history');
            if (historyEl.children.length === 1 && historyEl.children[0].classList.contains('italic')) {
                historyEl.innerHTML = '';
            }
            const moveRow = document.createElement('div');
            moveRow.className = "flex justify-between border-b border-slate-800 pb-1";
            moveRow.innerHTML = `<span>${move.color === 'w' ? 'Putih' : 'Hitam'}:</span> <span class="font-bold text-cyan-400">${move.from} ➔ ${move.to}</span>`;
            historyEl.appendChild(moveRow);
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        function checkGameStatus() {
            let statusText = "";
            if (game.in_checkmate()) {
                statusText = `Skakmat! Pemenang adalah ${game.turn() === 'w' ? 'Hitam' : 'Putih'}.`;
            } else if (game.in_draw()) {
                statusText = `Permainan Berakhir Seri (Draw)!`;
            } else {
                statusText = `Giliran: ${game.turn() === 'w' ? 'Putih' : 'Hitam'}`;
                if (game.in_check()) {
                    statusText += " (SKAK!)";
                }
            }
            document.getElementById('status-bar').innerText = statusText;
        }

        // Konfigurasi Papan Catur
        const config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/img/chesspieces/wikipedia/{piece}.png'
        };

        // Jalankan saat halaman dimuat
        $(document).ready(() => {
            board = Chessboard('board', config);
            initPeer();
            
            // Responsif saat ukuran jendela berubah
            $(window).resize(() => {
                board.resize();
            });
        });
    </script>
</body>
</html>
